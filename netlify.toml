# Configuration Netlify de Vécu.
# Netlify construit le site avec scripts/build.mjs (Node, sans dépendance) et publie dist/.
[build]
  # D19 : le site est publié sur GitHub Pages. Netlify n'assemble plus rien (économie de crédits).
  ignore = "exit 0"
  command = "node scripts/build.mjs"
  publish = "dist"

# Adresse de test non référencée : on demande aux moteurs de recherche de ne pas l'indexer.
# (En plus de la balise meta robots de index.html et de robots.txt.)
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Le service worker doit toujours être relu, pour que les nouvelles versions arrivent.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# Type exact du manifeste, pour l'installation sur l'écran d'accueil.
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
